name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 准备签名
        env:
          KEYSTORE_B64: ${{ secrets.XHM_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "XHM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置签名密钥，使用临时调试签名"
          fi

      - run: flutter --version

      - name: 构建（日志写入 ci.log）
        shell: bash
        env:
          XHM_KEYSTORE_PASSWORD: ${{ secrets.XHM_KEYSTORE_PASSWORD }}
          XHM_KEY_ALIAS: ${{ secrets.XHM_KEY_ALIAS }}
          XHM_KEY_PASSWORD: ${{ secrets.XHM_KEY_PASSWORD }}
        run: |
          set -o pipefail
          {
            echo "== flutter create" && flutter create --platforms=android --org com.vaneyi --project-name xhmplayer . &&
            echo "== patch" && python3 tool/patch_android.py &&
            echo "== pub get" && flutter pub get &&
            echo "== analyze" && flutter analyze --no-fatal-infos --no-fatal-warnings &&
            echo "== test" && flutter test &&
            echo "== build" && flutter build apk --release --target-platform android-arm64
          } 2>&1 | tee ci.log

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="v${VER}-build${{ github.run_number }}"
          OUT="xiaohuangmao-player-${VER}-build${{ github.run_number }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          gh release create "$TAG" "$OUT" ci.log --prerelease --title "小黄毛影音 ${VER}（第 ${{ github.run_number }} 次构建）" --notes "提交 ${{ github.sha }}"

      - name: 失败时发布日志
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch ci.log
          gh release create "ci-failed-${{ github.run_number }}" ci.log --prerelease --title "构建失败日志 ${{ github.run_number }}" --notes "提交 ${{ github.sha }}"

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 构建模拟器用安装包（x86_64）
        run: |
          flutter create --platforms=android --org com.vaneyi --project-name xhmplayer .
          python3 tool/patch_android.py > /dev/null
          flutter build apk --release --target-platform android-x64

      - name: 生成测试视频（含中文内封字幕）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          printf '1\n00:00:00,500 --> 00:00:30,000\n第一句字幕：你好，小黄毛\n' > sub.srt
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=30 -f lavfi -i sine=frequency=440:sample_rate=48000 -i sub.srt \
            -t 40 -map 0:v -map 1:a -map 2:s -c:v libx264 -pix_fmt yuv420p -c:a aac -c:s srt \
            -metadata:s:s:0 language=chi -metadata:s:s:0 title=中文 lesson.mkv
          ls -la lesson.mkv

      - name: 模拟器冒烟测试
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 tool/smoke.py build/app/outputs/flutter-apk/app-release.apk

      - name: 上传截图
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p shots && cd shots && zip -q ../smoke-shots.zip * || true
          cd .. && gh release create "smoke-${{ github.run_number }}" smoke-shots.zip --prerelease --title "冒烟测试截图 ${{ github.run_number }}" --notes "提交 ${{ github.sha }}"
